name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -e
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected Java version line: ${JAVA_VER_OUTPUT}"
          JAVA_MAJOR=$(echo "${JAVA_VER_OUTPUT}" | sed -E 's/.*version "([0-9]+)(\.[0-9]+)*.*".*/\1/')
          if [ -z "${JAVA_MAJOR}" ] || ! echo "${JAVA_MAJOR}" | grep -Eq '^[0-9]+$'; then
            echo "ERROR: Unable to detect active Java major version." >&2
            exit 1
          fi
          echo "Active Java major version: ${JAVA_MAJOR}"
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "ERROR: Active Java version (${JAVA_MAJOR}) is lower than 17." >&2
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Cache persistent debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
          restore-keys: |
            android-debug-keystore-

      - name: Restore or create persistent debug keystore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p ~/.android

          if [ -s ~/.android/debug.keystore ]; then
            echo "Persistent debug.keystore restored from cache."
          else
            echo "debug.keystore not found in cache; attempting to download from internal-keystore-vault..."
            gh release download internal-keystore-vault -p "debug.keystore" -D ~/.android/ --clobber || true
          fi

          if [ ! -s ~/.android/debug.keystore ]; then
            echo "Generating new persistent debug.keystore..."
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "Persisting debug.keystore to hidden prerelease tag internal-keystore-vault..."
            gh release create internal-keystore-vault ~/.android/debug.keystore \
              --title "Internal Keystore Vault (Do Not Delete)" \
              --notes "Persistent debug signing key for seamless in-place APK updates." \
              --prerelease || true
          fi

          cp -f ~/.android/debug.keystore ./debug.keystore

          if [ ! -s ~/.android/debug.keystore ] || [ ! -s ./debug.keystore ]; then
            echo "ERROR: Persistent debug.keystore is missing or empty." >&2
            exit 1
          fi
          echo "Confirmed both ~/.android/debug.keystore and ./debug.keystore exist and are non-empty."

      - name: Inject auto-incremented versionCode and versionName
        run: |
          set -e
          NEW_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          NEW_VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"

          if [ -f "app/build.gradle.kts" ]; then
            GRADLE_FILE="app/build.gradle.kts"
          elif [ -f "app/build.gradle" ]; then
            GRADLE_FILE="app/build.gradle"
          else
            echo "ERROR: Neither app/build.gradle.kts nor app/build.gradle was found." >&2
            exit 1
          fi

          sed -i -E "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = ${NEW_VERSION_CODE}/g" "${GRADLE_FILE}"
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${NEW_VERSION_CODE}/g" "${GRADLE_FILE}"
          sed -i -E "s/versionName[[:space:]]*=[[:space:]]*\"[^\"]*\"/versionName = \"${NEW_VERSION_NAME}\"/g" "${GRADLE_FILE}"
          sed -i -E "s/versionName[[:space:]]+\"[^\"]*\"/versionName \"${NEW_VERSION_NAME}\"/g" "${GRADLE_FILE}"

          echo "Injected into ${GRADLE_FILE}: versionCode=${NEW_VERSION_CODE}, versionName=${NEW_VERSION_NAME}"
          grep -E "versionCode|versionName" "${GRADLE_FILE}"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -e
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "${TARGET_APK}" ]; then
            echo "ERROR: Expected APK not found at ${TARGET_APK}" >&2
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            fi
            exit 1
          fi
          if [ ! -f "${TARGET_APK}" ]; then
            echo "ERROR: ${TARGET_APK} is not a regular file." >&2
            exit 1
          fi
          if [ ! -s "${TARGET_APK}" ]; then
            echo "ERROR: ${TARGET_APK} is empty." >&2
            exit 1
          fi
          case "${TARGET_APK}" in
            *.apk) ;;
            *)
              echo "ERROR: ${TARGET_APK} does not have a .apk extension." >&2
              exit 1
              ;;
          esac
          if [ "${TARGET_APK}" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Unexpected APK path ${TARGET_APK}" >&2
            exit 1
          fi
          echo "Verified valid non-empty APK at ${TARGET_APK}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release assets
        id: prepare_asset
        run: |
          set -e
          RELEASE_DIR=$(mktemp -d)
          RELEASE_APK_PATH="${RELEASE_DIR}/app-debug.apk"
          PUBLIC_APK_PATH="${RELEASE_DIR}/sibil-app.apk"
          cp "app/build/outputs/apk/debug/app-debug.apk" "${RELEASE_APK_PATH}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "${PUBLIC_APK_PATH}"
          if [ ! -s "${RELEASE_APK_PATH}" ] || [ ! -s "${PUBLIC_APK_PATH}" ]; then
            echo "ERROR: Prepared release assets are missing or empty in ${RELEASE_DIR}" >&2
            exit 1
          fi
          echo "release_apk_path=${RELEASE_APK_PATH}" >> "${GITHUB_OUTPUT}"
          echo "public_apk_path=${PUBLIC_APK_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Publish Sibil Public Release to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh --version
          PREPARED_APK="${{ steps.prepare_asset.outputs.release_apk_path }}"
          PUBLIC_APK="${{ steps.prepare_asset.outputs.public_apk_path }}"
          if [ ! -f "${PREPARED_APK}" ] || [ ! -s "${PREPARED_APK}" ] || [ "$(basename "${PREPARED_APK}")" != "app-debug.apk" ]; then
            echo "ERROR: Prepared APK is invalid or not named app-debug.apk: ${PREPARED_APK}" >&2
            exit 1
          fi

          RELEASE_TAG="v1.0.${{ github.run_number }}"
          RELEASE_TITLE="Sibil v1.0.0 Public Release (Build #${{ github.run_number }})"
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          VERSION_NAME="1.0.${{ github.run_number }}"

          RELEASE_NOTES="### Sibil — Academic Productivity & CE Suite
          Official public build generated via GitHub Actions.
          Version: 1.0.${{ github.run_number }} (Build Code: ${{ 100 + github.run_number }})
          Includes persistent signing for seamless in-place updates without data loss."

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${PREPARED_APK}" "${PUBLIC_APK}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${PREPARED_APK}" "${PUBLIC_APK}" \
              --title "${RELEASE_TITLE}" \
              --notes "${RELEASE_NOTES}" \
              --target "${GITHUB_SHA}" \
              --latest
          fi

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v1.0.${{ github.run_number }}"
          RELEASE_TITLE="Sibil v1.0.0 Public Release (Build #${{ github.run_number }})"
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          VERSION_NAME="1.0.${{ github.run_number }}"
          DIRECT_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
          PUBLIC_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/sibil-app.apk"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            gh release view "${RELEASE_TAG}"
            RELEASE_PAGE_URL=$(gh release view "${RELEASE_TAG}" --json url -q .url)
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_PAGE_URL}"
            echo "APK Filenames: app-debug.apk, sibil-app.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_APK_URL}"
            echo "PUBLIC APK DOWNLOAD: ${PUBLIC_APK_URL}"

            {
              echo "### Sibil — Academic Productivity & CE Suite"
              echo "Official public build generated via GitHub Actions."
              echo "- **Direct Download URL (app-debug.apk):** ${DIRECT_APK_URL}"
              echo "- **Public Download URL (sibil-app.apk):** ${PUBLIC_APK_URL}"
              echo "- **Version:** ${VERSION_NAME} (Build Code: ${VERSION_CODE})"
              echo "- **Release Tag:** ${RELEASE_TAG}"
              echo "- Includes persistent signing for seamless in-place updates without data loss."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "WARNING: GitHub Release publishing failed, but the APK build succeeded and the 'app-debug-apk' Actions artifact remains available."
            {
              echo "### APK BUILD RESULT"
              echo "WARNING: GitHub Release publishing failed, but the APK build succeeded and the \`app-debug-apk\` Actions artifact remains available."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
