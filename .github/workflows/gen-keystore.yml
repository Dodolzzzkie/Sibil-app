name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  make-key:
    runs-on: ubuntu-latest
    steps:
      - name: Create and Encode Keystore
        run: |
          keytool -genkey -v -keystore sibil-release.jks -alias sibil -keyalg RSA -keysize 2048 -validity 10000 -storepass sibil12345 -keypass sibil12345 -dname "CN=Sibil, C=PH"
          echo "==================== COPY BELOW THIS LINE ===================="
          base64 -w 0 sibil-release.jks
          echo ""
          echo "==================== END OF KEYSTORE ===================="
          
