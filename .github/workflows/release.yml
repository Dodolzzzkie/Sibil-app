name: Release Sibil CE APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.2)'
        required: false
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Production Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag and Version Info
        id: version_info
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ] && echo "${{ github.ref_name }}" | grep -Eq '^v'; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.2"
          fi
          
          # Clean version name (strip leading 'v' or 'V')
          VER_NAME=$(echo "$TAG" | sed -E 's/^[vV]//')
          
          # Compute or extract versionCode from build.gradle.kts if possible
          if grep -Eq 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' app/build.gradle.kts; then
            VER_CODE=$(grep -E 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' app/build.gradle.kts | head -n 1 | sed -E 's/[^0-9]//g')
          else
            VER_CODE=102
          fi

          echo "TAG_NAME=${TAG}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VER_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VER_CODE}" >> "$GITHUB_ENV"
          echo "Building Sibil CE Release ${TAG} (Version Name: ${VER_NAME}, Version Code: ${VER_CODE})"

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Inject Secret API Keys into Source
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECRET_KEYS: ${{ secrets.GEMINI_KEYS }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "Injecting GEMINI_API_KEY into app source..."
            find app/src/main/java -name "*.kt" -exec sed -i "s|\"__KEY_INJECTION_PLACEHOLDER__\"|\"$GEMINI_API_KEY\"|g" {} +
            echo "API key injected successfully."
          elif [ -n "$SECRET_KEYS" ]; then
            echo "Injecting GEMINI_KEYS list into app source..."
            FORMATTED_KEYS=$(echo "$SECRET_KEYS" | tr ',' '\n' | sed 's/^/"/' | sed 's/$/"/' | paste -sd, -)
            find app/src/main/java -name "*.kt" -exec sed -i "s|\"__KEY_INJECTION_PLACEHOLDER__\"|$FORMATTED_KEYS|g" {} +
            echo "API keys injected successfully."
          else
            echo "No GEMINI_API_KEY or GEMINI_KEYS found. Retaining placeholder string."
          fi

      - name: Ensure google-services.json is present in app module
        run: |
          if [ -f "google-services.json" ] && [ ! -f "app/google-services.json" ]; then
            cp -f "google-services.json" "app/google-services.json"
            echo "Copied google-services.json from root to app module."
          elif [ -f "app/google-services.json" ]; then
            echo "Found app/google-services.json"
          fi

      - name: Configure Production Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || 'sibilce_release_pass_2026' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || 'sibilce_release_pass_2026' }}
          KEY_ALIAS_NAME: ${{ secrets.KEY_ALIAS || 'sibilce' }}
        run: |
          set -e
          mkdir -p app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding provided KEYSTORE_BASE64 to app/release.jks..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          else
            echo "KEYSTORE_BASE64 not found in secrets. Generating dedicated production release keystore on the fly..."
            keytool -genkeypair -v \
              -keystore app/release.jks \
              -alias "$KEY_ALIAS_NAME" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Sibil Civil Engineering, OU=Engineering, O=Sibil, L=Manila, ST=NCR, C=PH"
          fi
          if [ ! -s app/release.jks ]; then
            echo "ERROR: app/release.jks is missing or empty!" >&2
            exit 1
          fi
          echo "Production release keystore successfully prepared at app/release.jks."

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Production Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || 'sibilce_release_pass_2026' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || 'sibilce_release_pass_2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'sibilce' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || 'sibilce_release_pass_2026' }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify and Standardize Release APK
        id: package_release
        run: |
          set -e
          RAW_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$RAW_APK" ]; then
            echo "ERROR: Release APK not found at $RAW_APK" >&2
            find app/build/outputs -type f || true
            exit 1
          fi
          RELEASE_APK="Sibil-CE-${TAG_NAME}.apk"
          cp "$RAW_APK" "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > "${RELEASE_APK}.sha256"
          APK_SIZE_HUMAN=$(du -h "$RELEASE_APK" | cut -f1)
          APK_SHA=$(cut -d ' ' -f 1 "${RELEASE_APK}.sha256")
          echo "APK_SIZE_HUMAN=${APK_SIZE_HUMAN}" >> "$GITHUB_ENV"
          echo "APK_SHA=${APK_SHA}" >> "$GITHUB_ENV"
          echo "Verified release APK: $RELEASE_APK ($APK_SIZE_HUMAN, SHA: $APK_SHA)"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sibil-CE-${{ env.TAG_NAME }}
          path: |
            Sibil-CE-${{ env.TAG_NAME }}.apk
            Sibil-CE-${{ env.TAG_NAME }}.apk.sha256
          if-no-files-found: error

      - name: Publish Production GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Sibil CE ${{ env.TAG_NAME }} - Official Production Release"
          draft: false
          prerelease: false
          files: |
            Sibil-CE-${{ env.TAG_NAME }}.apk
            Sibil-CE-${{ env.TAG_NAME }}.apk.sha256
          body: |
            ## 🚀 Sibil CE ${{ env.TAG_NAME }} - Official Production Release

            Welcome to the official production release of **Sibil CE** — the comprehensive productivity and formula suite for Civil Engineering students and board examinees.

            ### ✨ Highlights & Improvements
            - 🔐 **Production Release Signing**: Official production release key signed (never debug keys), avoiding Google Play Protect installation warnings.
            - 🔄 **In-Place Updates**: Seamlessly updates existing installations (`com.aistudio.civildesk.ceprod`) without data loss or requiring uninstallation.
            - 📱 **QR & Camera Deck Sharing**: Effortlessly generate and scan flashcard deck QR codes using Google Play Services barcode scanner.
            - 📐 **CE Formula Vault Navigation**: Table of Contents optimized with navigation gesture bottom inset padding.
            - ☁️ **Cloud Firestore & Offline Scholar**: Dual-engine synchronization for Schedule, Tasks, and Flashcards with instant offline fallback.

            ### 📱 Release Details
            | Metric | Value |
            | :--- | :--- |
            | **Application ID** | `com.aistudio.civildesk.ceprod` |
            | **Version Name** | `${{ env.VERSION_NAME }}` |
            | **Version Code** | `${{ env.VERSION_CODE }}` |
            | **Target SDK** | 36 (Android 16) |
            | **Min SDK** | 24 (Android 7.0 Nougat+) |
            | **File Size** | `${{ env.APK_SIZE_HUMAN }}` |
            | **SHA-256 Checksum** | `${{ env.APK_SHA }}` |

            ### 📥 Direct Download
            Download the official release APK directly below or from the release assets:
            - **[Sibil-CE-${{ env.TAG_NAME }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/Sibil-CE-${{ env.TAG_NAME }}.apk)**
