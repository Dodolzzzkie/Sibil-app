name: Sibil CE Production Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version Name (e.g., 1.0.3)'
        required: false
        default: '1.0.3'
      release_notes:
        description: 'Custom Release Notes'
        required: false
        default: 'Performance updates, hybrid QR flashcard sharing, and UI stability fixes.'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Dynamic Versioning
        id: versioning
        run: |
          set -e
          # Determine Version Name (from input or git tag)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_name }}" ]; then
            RAW_VERSION="${{ github.event.inputs.version_name }}"
          elif [ -n "${{ github.ref_name }}" ] && echo "${{ github.ref_name }}" | grep -Eq '^v'; then
            RAW_VERSION="${{ github.ref_name }}"
          else
            RAW_VERSION="1.0.3"
          fi

          # Strip leading 'v' or 'V' for clean semantic version number
          VERSION_CLEAN=$(echo "$RAW_VERSION" | sed -E 's/^[vV]//')
          TAG="v${VERSION_CLEAN}"

          # Compute strictly increasing versionCode: base 100 + run number
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))

          echo "VERSION=${VERSION_CLEAN}" >> "$GITHUB_ENV"
          echo "TAG_NAME=${TAG}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"

          # User custom release notes
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_notes }}" ]; then
            CUSTOM_NOTES="${{ github.event.inputs.release_notes }}"
          else
            CUSTOM_NOTES="Performance updates, hybrid QR flashcard sharing, and UI stability fixes."
          fi
          echo "USER_RELEASE_NOTES=${CUSTOM_NOTES}" >> "$GITHUB_ENV"

          echo "Configured Release: Tag=${TAG}, VersionName=${VERSION_CLEAN}, VersionCode=${VERSION_CODE}"

      - name: Inject Versioning into build.gradle.kts and MainActivity.kt
        run: |
          set -e
          # Inject into app/build.gradle.kts
          sed -i -E "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = ${VERSION_CODE}/g" app/build.gradle.kts
          sed -i -E "s/versionName[[:space:]]*=[[:space:]]*\"[^\"]*\"/versionName = \"${VERSION}\"/g" app/build.gradle.kts
          
          # Inject into MainActivity.kt if constants exist
          sed -i -E "s/const val APP_VERSION_CODE[[:space:]]*=[[:space:]]*[0-9]+/const val APP_VERSION_CODE = ${VERSION_CODE}/g" app/src/main/java/com/example/MainActivity.kt || true
          sed -i -E "s/const val APP_VERSION_NAME[[:space:]]*=[[:space:]]*\"[^\"]*\"/const val APP_VERSION_NAME = \"v${VERSION}\"/g" app/src/main/java/com/example/MainActivity.kt || true

          echo "Updated app/build.gradle.kts and MainActivity.kt with Version ${VERSION} (${VERSION_CODE})"

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Google Services Configuration
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            echo "Decoding GOOGLE_SERVICES_JSON_BASE64 to app/google-services.json..."
            echo "$GOOGLE_SERVICES_B64" | base64 -d > app/google-services.json
          elif [ -f "google-services.json" ]; then
            echo "Copying root google-services.json to app/google-services.json..."
            cp -f "google-services.json" "app/google-services.json"
          elif [ -f "app/google-services.json" ]; then
            echo "Existing app/google-services.json detected."
          else
            echo "Warning: google-services.json not found in repository or secrets. Continuing build..."
          fi

      - name: Inject Secret API Keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
        run: |
          TARGET_FILE="app/src/main/java/com/example/MainActivity.kt"
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "Injecting GEMINI_API_KEY into app source..."
            sed -i "s|\"__KEY_INJECTION_PLACEHOLDER__\"|\"$GEMINI_API_KEY\"|g" "$TARGET_FILE"
            echo "Single API Key injected successfully."
          elif [ -n "$GEMINI_KEYS" ]; then
            echo "Injecting comma-separated GEMINI_KEYS into app source..."
            FORMATTED_KEYS=$(echo "$GEMINI_KEYS" | tr ',' '\n' | sed 's/^/"/' | sed 's/$/"/' | paste -sd, -)
            sed -i "s|\"__KEY_INJECTION_PLACEHOLDER__\"|$FORMATTED_KEYS|g" "$TARGET_FILE"
            echo "Key pool injected successfully."
          else
            echo "No GEMINI_API_KEY found in secrets. Retaining placeholder string."
          fi

      - name: Prepare Continuous Production Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || 'sibilce_release_key_2026' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || 'sibilce_release_key_2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'sibilce' }}
        run: |
          set -e
          mkdir -p app
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Restoring official production release keystore from secret..."
            echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
          elif [ -f "app/release.keystore" ]; then
            echo "Found existing app/release.keystore."
          else
            echo "No KEYSTORE_BASE64 provided. Generating standardized reproducible release keystore..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Sibil Civil Engineering, OU=Engineering Release, O=Sibil CE, L=Manila, ST=NCR, C=PH"
          fi
          
          if [ ! -s app/release.keystore ]; then
            echo "ERROR: Failed to establish valid release.keystore!" >&2
            exit 1
          fi
          echo "Production signing keystore verified at app/release.keystore."

      - name: Grant Gradle wrapper execution permissions
        run: chmod +x ./gradlew

      - name: Assemble Production Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || 'sibilce_release_key_2026' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || 'sibilce_release_key_2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'sibilce' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || 'sibilce_release_key_2026' }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Standardize and Verify Release Artifact
        run: |
          set -e
          RAW_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$RAW_APK" ]; then
            echo "ERROR: Expected APK not found at $RAW_APK" >&2
            find app/build/outputs -type f || true
            exit 1
          fi

          RELEASE_FILENAME="Sibil-CE-v${VERSION}.apk"
          cp -f "$RAW_APK" "$RELEASE_FILENAME"
          sha256sum "$RELEASE_FILENAME" > "${RELEASE_FILENAME}.sha256"

          APK_FILESIZE=$(du -h "$RELEASE_FILENAME" | cut -f1)
          APK_SHA256=$(cut -d ' ' -f 1 "${RELEASE_FILENAME}.sha256")

          echo "RELEASE_FILENAME=${RELEASE_FILENAME}" >> "$GITHUB_ENV"
          echo "APK_FILESIZE=${APK_FILESIZE}" >> "$GITHUB_ENV"
          echo "APK_SHA256=${APK_SHA256}" >> "$GITHUB_ENV"

          echo "Standardized release APK: $RELEASE_FILENAME ($APK_FILESIZE, SHA-256: $APK_SHA256)"

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sibil-CE-v${{ env.VERSION }}
          path: |
            ${{ env.RELEASE_FILENAME }}
            ${{ env.RELEASE_FILENAME }}.sha256
          if-no-files-found: error

      - name: Publish Production GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Sibil CE v${{ env.VERSION }}"
          draft: false
          prerelease: false
          files: |
            ${{ env.RELEASE_FILENAME }}
            ${{ env.RELEASE_FILENAME }}.sha256
          body: |
            # 🚀 Sibil CE v${{ env.VERSION }}

            Welcome to the official production release of **Sibil CE** — the comprehensive engineering command center and formula suite designed specifically for Civil Engineering students and PRC licensure examinees.

            ---

            ### ✨ What's New
            - ${{ env.USER_RELEASE_NOTES }}
            - 🔐 **Cryptographic Continuous Signing**: Digitally signed with production release credentials, preventing Google Play Protect warnings and ensuring seamless in-place updates without uninstalling.
            - 📱 **QR & Camera Deck Sharing**: Real-time generation and native camera QR scanning powered by Google Play Services.
            - 📐 **CE Formula Vault Navigation**: Enhanced gesture clearance and reorganized Trigonometry anatomy inspector.
            - ☁️ **Cloud Sync & Offline Scholar**: Resilient Firestore real-time synchronization with instant zero-crash offline fallback.

            ---

            ### 📱 Build Information
            | Property | Specification |
            | :--- | :--- |
            | **Package Name (`applicationId`)** | `com.aistudio.civildesk.ceprod` |
            | **Version Name** | `v${{ env.VERSION }}` |
            | **Version Code** | `${{ env.VERSION_CODE }}` |
            | **Target SDK** | Android 16 (API 36) |
            | **Minimum SDK** | Android 7.0 (API 24) |
            | **File Size** | `${{ env.APK_FILESIZE }}` |
            | **Commit SHA** | `${{ github.sha }}` |
            | **SHA-256 Checksum** | `${{ env.APK_SHA256 }}` |

            ---

            ### 📥 Direct Download
            Direct APK Download: **[`${{ env.RELEASE_FILENAME }}`](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/${{ env.RELEASE_FILENAME }})**
