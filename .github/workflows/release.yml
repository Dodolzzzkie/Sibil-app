name: Sibil CE Production Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version (e.g. 1.0.3)'
        required: true
        default: '1.0.3'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Production Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore Google Services JSON
        if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Inject Gemini API Key
        run: |
          sed -i "s/__KEY_INJECTION_PLACEHOLDER__/${{ secrets.GEMINI_API_KEY }}/g" app/src/main/java/com/example/MainActivity.kt || true

      - name: Restore Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/sibil-release.jks

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Build Production APK
        env:
          KEYSTORE_PATH: "sibil-release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Prepare Release Artifact
        run: |
          VER="${{ github.event.inputs.version_name }}"
          cp app/build/outputs/apk/release/app-release.apk "Sibil-CE-v${VER}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Sibil CE v${{ github.event.inputs.version_name }}
          tag_name: v${{ github.event.inputs.version_name }}
          files: Sibil-CE-v${{ github.event.inputs.version_name }}.apk
          draft: false
          prerelease: false
          body: |
            ## Sibil CE v${{ github.event.inputs.version_name }}
            
            ### ✨ What's New
            * Cloud synchronization with Firebase Firestore.
            * Hybrid Flashcards (QR code sharing & scanning).
            * UI layout and tablet navigation fixes.
            
            ---
            **Download:** Download and install `Sibil-CE-v${{ github.event.inputs.version_name }}.apk` below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
